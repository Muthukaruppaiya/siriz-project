<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EEE4" />
    <meta
      name="description"
      content="Siriz Interiors composes quiet, lasting rooms in warm beige, cream, and deep brown."
    />
    <title>Siriz Interiors</title>
    <link rel="icon" href="/logo.png" />
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/loader.mp4" as="video" type="video/mp4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Figtree:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,640;1,9..144,520&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        background: #f3eee4;
      }
      /* a refresh keeps the visitor's place: hide the page until it is back there */
      html.is-restoring #root { opacity: 0; }
      html.is-restored #root { animation: siriz-restore-in 0.45s ease-out both; }
      @keyframes siriz-restore-in { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <script>
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0]
        var reload = nav ? nav.type === "reload" : performance.navigation && performance.navigation.type === 1
        if (reload && sessionStorage.getItem("siriz-scroll")) {
          document.documentElement.classList.add("is-restoring")
          // never leave the page hidden if something goes wrong
          setTimeout(function () { document.documentElement.classList.remove("is-restoring") }, 4000)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
